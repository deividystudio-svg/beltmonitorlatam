<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belt Monitor — GRU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f12;
      --bg2: #13161b;
      --bg3: #1a1e25;
      --border: #252a33;
      --border2: #2e3540;
      --text: #e8edf5;
      --text2: #8892a0;
      --text3: #4e5a6a;
      --accent: #3b7fff;
      --green: #2ecc71;
      --green-bg: #0d2818;
      --green-text: #5ddb95;
      --red: #e74c3c;
      --red-bg: #2a0e0e;
      --red-text: #f07070;
      --amber: #f39c12;
      --amber-bg: #261a07;
      --amber-text: #f5b942;
      --orange: #e8650a;
      --orange-bg: #2a1205;
      --orange-text: #f5864a;
      --urgent: #ff2d2d;
      --urgent-bg: #2a0505;
      --urgent-text: #ff6b6b;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --radius: 8px;
      --radius-sm: 5px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .brand-logo {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }
    .brand-sub {
      font-size: 12px;
      color: var(--text3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── CLOCK ── */
    .clock-wrap {
      text-align: right;
    }
    .clock {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .clock-label {
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .clock-date {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    /* ── TABLE ── */
    .table-wrap {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
      background: var(--bg2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
      min-width: 780px;
    }
    thead tr {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg3); }

    .col-prio   { width: 100px; }
    .col-origem { width: 110px; }
    .col-voo    { width: 115px; }
    .col-calco  { width: 110px; }
    .col-ppax   { width: 110px; }
    .col-pbag   { width: 155px; }
    .col-ubag   { width: 110px; }

    /* ── PRIO TOGGLE ── */
    .prio-toggle {
      display: inline-flex;
      border-radius: 99px;
      border: 1px solid var(--border2);
      overflow: hidden;
    }
    .prio-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--sans);
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text3);
      transition: background 0.15s, color 0.15s;
    }
    .prio-btn:hover { color: var(--text2); }
    .prio-btn.active-sim { background: var(--red-bg); color: var(--red-text); }
    .prio-btn.active-nao { background: var(--green-bg); color: var(--green-text); }

    /* ── VOO CELL ── */
    .voo-cell {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .voo-prefix {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }
    .voo-input {
      font-family: var(--mono);
      font-size: 13px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 3px 5px;
      color: var(--text);
      width: 58px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .voo-input:hover { border-color: var(--border2); }
    .voo-input:focus { border-color: var(--accent); background: var(--bg3); }
    .voo-input::placeholder { color: var(--text3); font-family: var(--sans); font-size: 12px; }

    /* ── EDITABLE TEXT ── */
    .editable-cell {
      outline: none;
      border: 1px solid transparent;
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      min-width: 60px;
      display: inline-block;
      cursor: text;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
      font-size: 13px;
    }
    .editable-cell:hover { border-color: var(--border2); }
    .editable-cell:focus { border-color: var(--accent); background: var(--bg3); }
    .editable-cell.placeholder { color: var(--text3); font-size: 12px; font-family: var(--sans); }

    /* ── TIME VALUE ── */
    .time-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .time-value {
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      color: var(--text);
      min-width: 52px;
      display: inline-block;
      transition: background 0.15s, border-color 0.15s;
    }
    .time-value:hover { background: var(--bg3); border-color: var(--border2); }
    .time-value.empty { color: var(--text3); font-size: 12px; font-family: var(--sans); }

    /* ── STATUS BADGE ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    .status-ok   { background: var(--green-bg); color: var(--green-text); }
    .status-late { background: var(--orange-bg); color: var(--orange-text); }
    .status-warn { background: var(--amber-bg); color: var(--amber-text); }
    .status-very-late { background: var(--red-bg); color: var(--red-text); }
    .status-urgent    { background: var(--urgent-bg); color: var(--urgent-text); animation: pulse-urgent 1s ease-in-out infinite; }
    @keyframes pulse-urgent {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-ok        { background: var(--green); }
    .dot-late      { background: var(--orange); }
    .dot-warn      { background: var(--amber); }
    .dot-very-late { background: var(--red); }
    .dot-urgent    { background: var(--urgent); }

    /* ── ADD ROW ── */
    .toolbar {
      margin-top: 1rem;
      display: flex;
      gap: 8px;
    }
    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-family: var(--sans);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .add-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }
    .add-btn svg { flex-shrink: 0; }

    .clear-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text3);
      font-size: 13px;
      font-family: var(--sans);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .clear-btn:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red); }

    .mode-switch {
      display: inline-flex;
      border-radius: 99px;
      border: 1px solid var(--border2);
      overflow: hidden;
      margin-left: 6px;
    }
    .mode-btn {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
      letter-spacing: 0.08em;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text3);
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn:hover { color: var(--text2); }
    .mode-btn.active-dom   { background: var(--accent); color: #fff; }
    .mode-btn.active-inter { background: #7c3aed; color: #fff; }

    .mode-limits {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      align-self: center;
      margin-left: 8px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── PICKER MODAL ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .overlay.open { display: flex; }
    .picker-card {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 1.5rem;
      width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .picker-header {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 1.25rem;
    }
    .drum-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 1.25rem;
    }
    .drum {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
    }
    .drum-lbl {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .drum-val {
      font-family: var(--mono);
      font-size: 44px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
      user-select: none;
    }
    .drum-sep {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 600;
      color: var(--text3);
      padding: 0 4px;
      margin-top: 14px;
    }
    .drum-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      padding: 6px;
      border-radius: var(--radius-sm);
      transition: color 0.1s, background 0.1s;
      line-height: 1;
      font-size: 20px;
    }
    .drum-btn:hover { color: var(--text); background: var(--bg3); }

    .quick-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.25rem;
    }
    .quick-chip {
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid var(--border2);
      font-size: 11px;
      font-family: var(--mono);
      cursor: pointer;
      color: var(--text2);
      background: transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .quick-chip:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }
    .quick-chip.is-now { border-color: var(--accent); color: var(--accent); }

    .picker-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .p-btn {
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: var(--sans);
      cursor: pointer;
      border: 1px solid var(--border2);
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .p-btn-clear  { color: var(--text3); margin-right: auto; }
    .p-btn-clear:hover  { background: var(--red-bg); color: var(--red-text); border-color: var(--red); }
    .p-btn-cancel { color: var(--text2); }
    .p-btn-cancel:hover { background: var(--bg3); color: var(--text); }
    .p-btn-ok     { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
    .p-btn-ok:hover { background: #2d6fe0; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">BELT<span>MONITOR</span></div>
    <div class="brand-sub">GRU · Monitoramento de Bagagens</div>
  </div>
  <div class="clock-wrap">
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-label">São Paulo (BRT)</div>
    <div class="clock-date" id="clock-date"></div>
  </div>
</div>

<div class="table-wrap">
  <table id="flight-table">
    <thead>
      <tr>
        <th class="col-origem">Origem</th>
        <th class="col-voo">VOO</th>
        <th class="col-calco">Calço</th>
        <th class="col-ppax">1º Pax</th>
        <th class="col-pbag">1ª Bag</th>
        <th class="col-ubag">Última Bag</th>
        <th class="col-prio">Prio</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="toolbar">
  <button class="add-btn" id="add-btn">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Adicionar voo
  </button>
  <button class="clear-btn" id="clear-btn">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Limpar tudo
  </button>

  <div class="mode-switch" id="mode-switch">
    <button class="mode-btn" id="mode-dom" onclick="setMode('dom')">DOM</button>
    <button class="mode-btn" id="mode-inter" onclick="setMode('inter')">INTER</button>
  </div>
  <div class="mode-limits" id="mode-limits"></div>

  <span id="save-indicator" style="margin-left:auto;font-size:11px;color:var(--green-text);font-family:var(--mono);opacity:0;transition:opacity 0.4s;align-self:center;"></span>
</div>

<!-- TIME PICKER MODAL -->
<div class="overlay" id="overlay">
  <div class="picker-card">
    <div class="picker-header" id="picker-header">Selecionar horário</div>
    <div class="drum-row">
      <div class="drum">
        <div class="drum-lbl">Hora</div>
        <button class="drum-btn" onclick="changeHour(1)">&#9650;</button>
        <div class="drum-val" id="ph">00</div>
        <button class="drum-btn" onclick="changeHour(-1)">&#9660;</button>
      </div>
      <div class="drum-sep">:</div>
      <div class="drum">
        <div class="drum-lbl">Min</div>
        <button class="drum-btn" onclick="changeMin(1)">&#9650;</button>
        <div class="drum-val" id="pm">00</div>
        <button class="drum-btn" onclick="changeMin(-1)">&#9660;</button>
      </div>
    </div>
    <div class="quick-wrap" id="quick-wrap"></div>
    <div class="picker-actions">
      <button class="p-btn p-btn-clear" onclick="clearTime()">Limpar</button>
      <button class="p-btn p-btn-cancel" onclick="closePicker()">Cancelar</button>
      <button class="p-btn p-btn-ok" onclick="confirmTime()">Confirmar</button>
    </div>
  </div>
</div>

<script>
  const LIMITS = {
    dom:   { late: 30, veryLate: 45, urgent: 60 },
    inter: { late: 50, veryLate: 65, urgent: 80 },
  };

  let flightMode = 'dom';
  let rows = [], nextId = 1;
  let pHour = 0, pMin = 0, pTarget = null;

  const pad = n => String(n).padStart(2, '0');
  function getLimits() { return LIMITS[flightMode]; }
  function toMs(min)   { return min * 60 * 1000; }

  function spNow() {
    return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
  }

  function updateClock() {
    const t = spNow();
    const days   = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('clock').textContent      = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
    document.getElementById('clock-date').textContent = `${days[t.getDay()]}, ${t.getDate()} de ${months[t.getMonth()]} de ${t.getFullYear()}`;
  }

  function timeToMs(hhmm) {
    if (!hhmm) return null;
    const [h, m] = hhmm.split(':').map(Number);
    return (h * 60 + m) * 60000;
  }

  function bagStatus(row) {
    const cMs = timeToMs(row.calco);
    if (!cMs) return null;
    const bMs  = timeToMs(row.primeira_bag);
    const t    = spNow();
    const nowMs = (t.getHours() * 60 + t.getMinutes()) * 60000;
    const lim  = getLimits();
    const diff = bMs != null ? bMs - cMs : nowMs - cMs;
    if (diff >= toMs(lim.urgent))   return 'urgent';
    if (diff >= toMs(lim.veryLate)) return 'very-late';
    if (diff >= toMs(lim.late))     return 'late';
    return bMs != null ? 'ok' : 'pending';
  }

  function badge(status) {
    if (!status) return '';
    const map = {
      pending:    ['status-warn',      'dot-warn',      'Aguardando'],
      late:       ['status-late',      'dot-late',      'Atrasado'],
      'very-late':['status-very-late', 'dot-very-late', 'Muito Atrasado'],
      urgent:     ['status-urgent',    'dot-urgent',    '⚠ URGÊNCIA'],
      ok:         ['status-ok',        'dot-ok',        'No prazo'],
    };
    const [cls, dot, lbl] = map[status];
    return `<span class="status-badge ${cls}"><span class="dot ${dot}"></span>${lbl}</span>`;
  }

  function renderTable() {
    const tbody  = document.getElementById('tbody');
    const wrap   = tbody.closest('.table-wrap');
    const scrollX = wrap.scrollLeft;
    tbody.innerHTML = '';
    rows.forEach(r => {
      const st = bagStatus(r);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="editable-cell ${!r.origem?'placeholder':''}" contenteditable="true" data-id="${r.id}" data-field="origem" onblur="saveText(this)" onfocus="clearPlaceholder(this)">${r.origem||'Origem'}</span></td>
        <td>
          <div class="voo-cell">
            <span class="voo-prefix">LA</span>
            <input class="voo-input" type="text" placeholder="0000" maxlength="8" value="${r.voo}" oninput="saveVoo(${r.id},this.value)" />
          </div>
        </td>
        <td><div class="time-cell"><span class="time-value ${!r.calco?'empty':''}" onclick="openPicker(${r.id},'calco')">${r.calco||'Definir'}</span></div></td>
        <td><div class="time-cell"><span class="time-value ${!r.primeira_pax?'empty':''}" onclick="openPicker(${r.id},'primeira_pax')">${r.primeira_pax||'Definir'}</span></div></td>
        <td>
          <div class="time-cell">
            <span class="time-value ${!r.primeira_bag?'empty':''}" onclick="openPicker(${r.id},'primeira_bag')">${r.primeira_bag||'Definir'}</span>
            ${badge(st)}
          </div>
        </td>
        <td><div class="time-cell"><span class="time-value ${!r.ultima_bag?'empty':''}" onclick="openPicker(${r.id},'ultima_bag')">${r.ultima_bag||'Definir'}</span></div></td>
        <td>
          <div class="prio-toggle">
            <button class="prio-btn ${r.prio==='sim'?'active-sim':''}" onclick="setPrio(${r.id},'sim')">Sim</button>
            <button class="prio-btn ${r.prio==='nao'?'active-nao':''}" onclick="setPrio(${r.id},'nao')">Não</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
    wrap.scrollLeft = scrollX;
    persistData();
  }

  function clearPlaceholder(el) {
    if (el.classList.contains('placeholder')) {
      el.textContent = '';
      el.classList.remove('placeholder');
    }
  }

  function saveText(el) {
    const id  = +el.dataset.id;
    const row = rows.find(r => r.id === id);
    if (!row) return;
    const val = el.textContent.trim();
    row[el.dataset.field] = val;
    if (!val) { el.textContent = 'Origem'; el.classList.add('placeholder'); }
    else el.classList.remove('placeholder');
    persistData();
  }

  function saveVoo(id, val) {
    const row = rows.find(r => r.id === id);
    if (row) { row.voo = val; persistData(); }
  }

  function setPrio(id, val) {
    const row = rows.find(r => r.id === id);
    if (!row) return;
    row.prio = row.prio === val ? '' : val;
    renderTable();
  }

  function addRow() {
    rows.push({ id: nextId++, prio: '', origem: '', voo: '', calco: '', primeira_pax: '', primeira_bag: '', ultima_bag: '' });
    renderTable();
  }

  /* ── PERSIST ── */
  function persistData() {
    try {
      localStorage.setItem('beltmonitor_rows',   JSON.stringify(rows));
      localStorage.setItem('beltmonitor_nextid', String(nextId));
      showSaved();
    } catch(e) {}
  }

  function loadData() {
    try {
      const saved   = localStorage.getItem('beltmonitor_rows');
      const savedId = localStorage.getItem('beltmonitor_nextid');
      if (saved) {
        rows    = JSON.parse(saved);
        nextId  = savedId ? parseInt(savedId) : rows.length + 1;
        return true;
      }
    } catch(e) {}
    return false;
  }

  function showSaved() {
    const el = document.getElementById('save-indicator');
    if (!el) return;
    el.textContent = 'Salvo ✓';
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = '0'; }, 2000);
  }

  /* ── MODE SWITCH ── */
  function setMode(mode) {
    flightMode = mode;
    localStorage.setItem('beltmonitor_mode', mode);
    document.getElementById('mode-dom').className   = 'mode-btn' + (mode === 'dom'   ? ' active-dom'   : '');
    document.getElementById('mode-inter').className = 'mode-btn' + (mode === 'inter' ? ' active-inter' : '');
    const lim = getLimits();
    document.getElementById('mode-limits').textContent = `${lim.late}min → ${lim.veryLate}min → ${lim.urgent}min`;
    renderTable();
  }

  /* ── PICKER ── */
  const FIELD_LABELS = { calco:'Calço', primeira_pax:'1º Pax', primeira_bag:'1ª Bag', ultima_bag:'Última Bag' };

  function openPicker(id, field) {
    const row = rows.find(r => r.id === id);
    pTarget   = { id, field };
    document.getElementById('picker-header').textContent = (FIELD_LABELS[field] || 'Horário') + ' — horário de São Paulo';
    if (row[field]) { [pHour, pMin] = row[field].split(':').map(Number); }
    else { const t = spNow(); pHour = t.getHours(); pMin = t.getMinutes(); }
    updateDrum();
    buildQuick();
    document.getElementById('overlay').classList.add('open');
  }

  function buildQuick() {
    const t    = spNow();
    const base = t.getHours() * 60 + t.getMinutes();
    document.getElementById('quick-wrap').innerHTML = [-30,-15,-10,-5,0,5,10,15,30].map(o => {
      const total = ((base + o) % 1440 + 1440) % 1440;
      const label = `${pad(Math.floor(total/60))}:${pad(total%60)}`;
      return `<button class="quick-chip${o===0?' is-now':''}" onclick="setQuick('${label}')">${label}${o===0?' ←':''}</button>`;
    }).join('');
  }

  function setQuick(t)    { [pHour, pMin] = t.split(':').map(Number); updateDrum(); }
  function changeHour(d)  { pHour = (pHour + d + 24) % 24; updateDrum(); }
  function changeMin(d)   { pMin  = (pMin  + d + 60) % 60; updateDrum(); }
  function updateDrum()   {
    document.getElementById('ph').textContent = pad(pHour);
    document.getElementById('pm').textContent = pad(pMin);
  }

  function confirmTime() {
    if (!pTarget) return;
    const row = rows.find(r => r.id === pTarget.id);
    if (row) row[pTarget.field] = `${pad(pHour)}:${pad(pMin)}`;
    closePicker();
    renderTable();
  }

  function clearTime() {
    if (!pTarget) return;
    const row = rows.find(r => r.id === pTarget.id);
    if (row) row[pTarget.field] = '';
    closePicker();
    renderTable();
  }

  function closePicker() {
    document.getElementById('overlay').classList.remove('open');
    pTarget = null;
  }

  document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closePicker(); });
  document.getElementById('add-btn').addEventListener('click', addRow);
  document.getElementById('clear-btn').addEventListener('click', () => {
    if (confirm('Limpar todos os voos?')) { rows = []; nextId = 1; renderTable(); }
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('overlay').classList.contains('open')) return;
    if (e.key === 'Escape') closePicker();
    if (e.key === 'Enter')  confirmTime();
  });

  /* ── INIT ── */
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(renderTable, 15000);

  const savedMode = localStorage.getItem('beltmonitor_mode') || 'dom';
  const loaded    = loadData();
  if (!loaded || rows.length === 0) { addRow(); addRow(); }
  setMode(savedMode);
</script>
</body>
</html>
