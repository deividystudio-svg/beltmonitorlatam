<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belt Monitor — GRU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f12; --bg2: #13161b; --bg3: #1a1e25;
      --border: #252a33; --border2: #2e3540;
      --text: #e8edf5; --text2: #8892a0; --text3: #4e5a6a;
      --accent: #3b7fff;
      --green: #2ecc71; --green-bg: #0d2818; --green-text: #5ddb95;
      --red: #e74c3c;   --red-bg: #2a0e0e;   --red-text: #f07070;
      --amber: #f39c12; --amber-bg: #261a07; --amber-text: #f5b942;
      --orange: #e8650a;--orange-bg: #2a1205;--orange-text: #f5864a;
      --urgent: #ff2d2d;--urgent-bg: #2a0505;--urgent-text: #ff6b6b;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --radius: 8px; --radius-sm: 5px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1.5rem 4rem; }

    /* HEADER */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand-logo { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
    .brand-logo span { color: var(--accent); }
    .brand-sub { font-size: 12px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; }
    .clock-wrap { text-align: right; }
    .clock { font-family: var(--mono); font-size: 36px; font-weight: 600; color: var(--text); letter-spacing: 0.06em; line-height: 1; }
    .clock-label { font-size: 10px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
    .clock-date { font-size: 12px; color: var(--text2); margin-top: 2px; }

    /* TABLE */
    .table-wrap { border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; background: var(--bg2); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; min-width: 820px; }
    thead tr { background: var(--bg3); border-bottom: 1px solid var(--border); }
    th { padding: 10px 14px; font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); text-align: left; white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg3); }
    .col-origem { width: 160px; } .col-voo { width: 115px; } .col-calco { width: 110px; }
    .col-esteira { width: 80px; } .col-ppax { width: 110px; } .col-pbag { width: 160px; } .col-ubag { width: 110px; } .col-prio { width: 100px; }

    /* ESTEIRA */
    .esteira-input { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 2px 6px; width: 56px; outline: none; text-align: center; transition: border-color 0.15s, background 0.15s; }
    .esteira-input:hover { border-color: var(--border2); }
    .esteira-input:focus { border-color: var(--accent); background: var(--bg3); }
    .esteira-input::placeholder { color: var(--text3); font-size: 12px; font-family: var(--sans); font-weight: 400; }

    /* PRIO */
    .prio-toggle { display: inline-flex; border-radius: 99px; border: 1px solid var(--border2); overflow: hidden; }
    .prio-btn { padding: 4px 10px; font-size: 11px; font-weight: 500; font-family: var(--sans); cursor: pointer; border: none; background: transparent; color: var(--text3); transition: background 0.15s, color 0.15s; }
    .prio-btn:hover { color: var(--text2); }
    .prio-btn.active-sim { background: var(--green-bg); color: var(--green-text); }
    .prio-btn.active-nao { background: var(--red-bg);   color: var(--red-text); }

    /* VOO */
    .voo-cell { display: flex; align-items: center; gap: 4px; }
    .voo-prefix { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
    .voo-input { font-family: var(--mono); font-size: 13px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 3px 5px; color: var(--text); width: 58px; outline: none; transition: border-color 0.15s, background 0.15s; }
    .voo-input:hover { border-color: var(--border2); }
    .voo-input:focus { border-color: var(--accent); background: var(--bg3); }
    .voo-input::placeholder { color: var(--text3); font-family: var(--sans); font-size: 12px; }

    /* ORIGEM AUTOCOMPLETE */
    .origem-wrap { position: relative; }
    .origem-display { font-size: 13px; color: var(--text); cursor: pointer; padding: 3px 6px; border-radius: var(--radius-sm); border: 1px solid transparent; display: flex; align-items: center; gap: 5px; transition: border-color 0.15s, background 0.15s; }
    .origem-display:hover { border-color: var(--border2); background: var(--bg3); }
    .origem-name { font-weight: 500; }
    .origem-iata { font-family: var(--mono); font-size: 11px; color: var(--accent); background: rgba(59,127,255,0.1); padding: 1px 5px; border-radius: 3px; }
    .origem-empty { color: var(--text3); font-size: 12px; }
    .origem-input { font-size: 13px; background: var(--bg3); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 4px 8px; color: var(--text); width: 140px; outline: none; font-family: var(--sans); }
    .origem-dropdown { position: absolute; top: calc(100% + 4px); left: 0; min-width: 220px; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 500; overflow: hidden; display: none; }
    .origem-dropdown.open { display: block; }
    .origem-option { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; gap: 10px; transition: background 0.1s; }
    .origem-option:hover { background: var(--bg3); }
    .origem-option-name { font-size: 13px; color: var(--text); }
    .origem-option-iata { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); }
    .origem-option-empty { padding: 10px 12px; font-size: 12px; color: var(--text3); }

    /* TIME */
    .time-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .time-value { font-family: var(--mono); font-size: 13px; cursor: pointer; padding: 3px 8px; border-radius: var(--radius-sm); border: 1px solid transparent; color: var(--text); min-width: 52px; display: inline-block; transition: background 0.15s, border-color 0.15s; }
    .time-value:hover { background: var(--bg3); border-color: var(--border2); }
    .time-value.empty { color: var(--text3); font-size: 12px; font-family: var(--sans); }

    /* STATUS BADGE */
    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .status-ok        { background: var(--green-bg);  color: var(--green-text); }
    .status-late      { background: var(--orange-bg); color: var(--orange-text); }
    .status-very-late { background: var(--red-bg);    color: var(--red-text); }
    .status-warn      { background: var(--amber-bg);  color: var(--amber-text); }
    .status-urgent    { background: var(--urgent-bg); color: var(--urgent-text); animation: pulse-urgent 1s ease-in-out infinite; }
    @keyframes pulse-urgent { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-ok        { background: var(--green); }
    .dot-late      { background: var(--orange); }
    .dot-very-late { background: var(--red); }
    .dot-warn      { background: var(--amber); }
    .dot-urgent    { background: var(--urgent); }

    /* TOOLBAR */
    .toolbar { margin-top: 1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: transparent; color: var(--text2); font-size: 13px; font-family: var(--sans); cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
    .add-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }
    .clear-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: transparent; color: var(--text3); font-size: 13px; font-family: var(--sans); cursor: pointer; transition: background 0.15s, color 0.15s; }
    .clear-btn:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red); }
    .mode-switch { display: inline-flex; border-radius: 99px; border: 1px solid var(--border2); overflow: hidden; margin-left: 6px; }
    .mode-btn { padding: 6px 14px; font-size: 11px; font-weight: 600; font-family: var(--mono); letter-spacing: 0.08em; cursor: pointer; border: none; background: transparent; color: var(--text3); transition: background 0.15s, color 0.15s; }
    .mode-btn:hover { color: var(--text2); }
    .mode-btn.active-dom   { background: var(--accent); color: #fff; }
    .mode-btn.active-inter { background: #7c3aed; color: #fff; }
    .mode-limits { font-family: var(--mono); font-size: 10px; color: var(--text3); align-self: center; margin-left: 8px; letter-spacing: 0.04em; white-space: nowrap; }

    /* TIME PICKER MODAL */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 999; }
    .overlay.open { display: flex; }
    .picker-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 1.5rem; width: 300px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .picker-header { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 1rem; }

    /* MANUAL TIME INPUT */
    .picker-manual { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 1rem; }
    .picker-manual-input { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--text); background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); width: 72px; text-align: center; outline: none; padding: 6px 4px; transition: border-color 0.15s; -moz-appearance: textfield; }
    .picker-manual-input::-webkit-outer-spin-button,
    .picker-manual-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .picker-manual-input:focus { border-color: var(--accent); }
    .picker-manual-sep { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--text3); }

    .drum-row { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 1.25rem; }
    .drum { display: flex; flex-direction: column; align-items: center; width: 80px; }
    .drum-lbl { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
    .drum-val { font-family: var(--mono); font-size: 44px; font-weight: 600; color: var(--text); line-height: 1; user-select: none; }
    .drum-sep { font-family: var(--mono); font-size: 32px; font-weight: 600; color: var(--text3); padding: 0 4px; margin-top: 14px; }
    .drum-btn { background: none; border: none; cursor: pointer; color: var(--text3); padding: 6px; border-radius: var(--radius-sm); transition: color 0.1s, background 0.1s; line-height: 1; font-size: 20px; }
    .drum-btn:hover { color: var(--text); background: var(--bg3); }

    .quick-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
    .quick-chip { padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border2); font-size: 11px; font-family: var(--mono); cursor: pointer; color: var(--text2); background: transparent; transition: background 0.1s, color 0.1s, border-color 0.1s; }
    .quick-chip:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }
    .quick-chip.is-now { border-color: var(--accent); color: var(--accent); }
    .picker-actions { display: flex; gap: 8px; align-items: center; }
    .p-btn { padding: 7px 16px; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--sans); cursor: pointer; border: 1px solid var(--border2); background: transparent; transition: background 0.15s, color 0.15s; }
    .p-btn-clear  { color: var(--text3); margin-right: auto; }
    .p-btn-clear:hover  { background: var(--red-bg); color: var(--red-text); border-color: var(--red); }
    .p-btn-cancel { color: var(--text2); }
    .p-btn-cancel:hover { background: var(--bg3); color: var(--text); }
    .p-btn-ok { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
    .p-btn-ok:hover { background: #2d6fe0; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* MOBILE */
    @media (max-width: 700px) {
      body { padding: 1rem 0.75rem 5rem; }
      .header { flex-direction: column; align-items: flex-start; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 1rem; }
      .clock-wrap { text-align: left; }
      .clock { font-size: 28px; }
      .brand-logo { font-size: 18px; }
      .table-wrap { display: none; }
      .cards-wrap { display: flex; flex-direction: column; gap: 10px; }
      .flight-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .card-flight-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .card-voo-wrap { display: flex; align-items: center; gap: 3px; }
      .card-voo-prefix { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }
      .card-voo-input { font-family: var(--mono); font-size: 13px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 2px 4px; color: var(--text); width: 52px; outline: none; transition: border-color 0.15s; }
      .card-voo-input:focus { border-color: var(--accent); background: var(--bg3); }
      .card-voo-input::placeholder { color: var(--text3); font-size: 12px; }
      .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .card-field { display: flex; flex-direction: column; gap: 4px; }
      .card-field-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-family: var(--mono); }
      .card-field-val { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text); cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3); transition: border-color 0.15s; text-align: center; }
      .card-field-val:hover { border-color: var(--accent); }
      .card-field-val.empty { color: var(--text3); font-size: 12px; font-family: var(--sans); font-weight: 400; }
      .card-bag-inner { display: flex; align-items: center; gap: 8px; }
      .card-bag-val { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text); cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3); transition: border-color 0.15s; flex: 1; text-align: center; }
      .card-bag-val:hover { border-color: var(--accent); }
      .card-bag-val.empty { color: var(--text3); font-size: 12px; font-family: var(--sans); font-weight: 400; }
      .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid var(--border); }
      .toolbar { flex-wrap: wrap; gap: 8px; }
      .mode-limits { display: none; }
      .picker-card { width: calc(100vw - 2rem); max-width: 320px; }
      .drum-val { font-size: 38px; }
      .origem-dropdown { min-width: 200px; }
    }
    @media (min-width: 701px) { .cards-wrap { display: none; } }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">BELT<span>MONITOR</span></div>
    <div class="brand-sub">GRU · Monitoramento de Bagagens</div>
  </div>
  <div class="clock-wrap">
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-label">São Paulo (BRT)</div>
    <div class="clock-date" id="clock-date"></div>
  </div>
</div>

<div class="table-wrap">
  <table id="flight-table">
    <thead>
      <tr>
        <th class="col-origem">Origem</th>
        <th class="col-voo">VOO</th>
        <th class="col-calco">Calço</th>
        <th class="col-esteira">Esteira</th>
        <th class="col-ppax">1º Pax</th>
        <th class="col-pbag">1ª Bag</th>
        <th class="col-ubag">Última Bag</th>
        <th class="col-prio">Prio</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="cards-wrap" id="cards-wrap"></div>

<div class="toolbar">
  <button class="add-btn" id="add-btn">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    Adicionar voo
  </button>
  <button class="clear-btn" id="clear-btn">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Limpar tudo
  </button>
  <div class="mode-switch" id="mode-switch">
    <button class="mode-btn" id="mode-dom"   onclick="setMode('dom')">DOM</button>
    <button class="mode-btn" id="mode-inter" onclick="setMode('inter')">INTER</button>
  </div>
  <div class="mode-limits" id="mode-limits"></div>
  <span id="save-indicator" style="margin-left:auto;font-size:11px;color:var(--green-text);font-family:var(--mono);opacity:0;transition:opacity 0.4s;align-self:center;"></span>
</div>

<!-- TIME PICKER MODAL -->
<div class="overlay" id="overlay">
  <div class="picker-card">
    <div class="picker-header" id="picker-header">Selecionar horário</div>
    <div class="picker-manual">
      <input class="picker-manual-input" id="manual-h" type="number" min="0" max="23" placeholder="HH" />
      <span class="picker-manual-sep">:</span>
      <input class="picker-manual-input" id="manual-m" type="number" min="0" max="59" placeholder="MM" />
    </div>
    <div class="drum-row">
      <div class="drum">
        <div class="drum-lbl">Hora</div>
        <button class="drum-btn" onclick="changeHour(1)">&#9650;</button>
        <div class="drum-val" id="ph">00</div>
        <button class="drum-btn" onclick="changeHour(-1)">&#9660;</button>
      </div>
      <div class="drum-sep">:</div>
      <div class="drum">
        <div class="drum-lbl">Min</div>
        <button class="drum-btn" onclick="changeMin(1)">&#9650;</button>
        <div class="drum-val" id="pm">00</div>
        <button class="drum-btn" onclick="changeMin(-1)">&#9660;</button>
      </div>
    </div>
    <div class="quick-wrap" id="quick-wrap"></div>
    <div class="picker-actions">
      <button class="p-btn p-btn-clear"  onclick="clearTime()">Limpar</button>
      <button class="p-btn p-btn-cancel" onclick="closePicker()">Cancelar</button>
      <button class="p-btn p-btn-ok"     onclick="confirmTime()">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* ── AIRPORT DATABASE ── */
const AIRPORTS = [
  /* ── BRASIL PRINCIPAIS ── */
  {name:'Guarulhos',            iata:'GRU'}, {name:'Congonhas',           iata:'CGH'},
  {name:'Campinas Viracopos',   iata:'VCP'}, {name:'Santos Dumont',        iata:'SDU'},
  {name:'Galeão',               iata:'GIG'}, {name:'Brasília',             iata:'BSB'},
  {name:'Confins',              iata:'CNF'}, {name:'Porto Alegre',         iata:'POA'},
  {name:'Curitiba',             iata:'CWB'}, {name:'Salvador',             iata:'SSA'},
  {name:'Recife',               iata:'REC'}, {name:'Fortaleza',            iata:'FOR'},
  {name:'Belém',                iata:'BEL'}, {name:'Manaus',               iata:'MAO'},
  {name:'Natal',                iata:'NAT'}, {name:'Maceió',               iata:'MCZ'},
  {name:'João Pessoa',          iata:'JPA'}, {name:'Aracaju',              iata:'AJU'},
  {name:'Teresina',             iata:'THE'}, {name:'São Luís',             iata:'SLZ'},
  {name:'Macapá',               iata:'MCP'}, {name:'Boa Vista',            iata:'BVB'},
  {name:'Porto Velho',          iata:'PVH'}, {name:'Rio Branco',           iata:'RBR'},
  {name:'Cuiabá',               iata:'CGB'}, {name:'Campo Grande',         iata:'CGR'},
  {name:'Goiânia',              iata:'GYN'}, {name:'Palmas',               iata:'PMW'},
  {name:'Vitória',              iata:'VIX'}, {name:'Florianópolis',        iata:'FLN'},
  {name:'Londrina',             iata:'LDB'}, {name:'Foz do Iguaçu',        iata:'IGU'},
  {name:'Maringá',              iata:'MGF'}, {name:'Joinville',            iata:'JOI'},

function searchAirports(q) {
  if (!q || q.length < 2) return [];
  const u = q.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return AIRPORTS.filter(a => {
    const name = a.name.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return name.includes(u) || a.iata.includes(u);
  }).slice(0, 8);
}

/* ── STATE ── */
const LIMITS = {
  dom:   { late: 30, veryLate: 45, urgent: 60 },
  inter: { late: 50, veryLate: 65, urgent: 80 },
};
let flightMode = 'dom';
let rows = [], nextId = 1;
let pHour = 0, pMin = 0, pTarget = null;
let activeDropdown = null;

const pad = n => String(n).padStart(2,'0');
function getLimits() { return LIMITS[flightMode]; }
function toMs(min)   { return min * 60 * 1000; }

function spNow() {
  return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
}

/* ── CLOCK ── */
function updateClock() {
  const t = spNow();
  const days   = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  document.getElementById('clock').textContent      = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  document.getElementById('clock-date').textContent = `${days[t.getDay()]}, ${t.getDate()} de ${months[t.getMonth()]} de ${t.getFullYear()}`;
}

/* ── STATUS ── */
function timeToMinutes(hhmm) {
  if (!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
function bagStatus(row) {
  const cMin = timeToMinutes(row.calco);
  if (cMin === null) return null;
  const bMin   = timeToMinutes(row.primeira_bag);
  const t      = spNow();
  const nowMin = t.getHours() * 60 + t.getMinutes();
  const lim    = getLimits();

  // midnight crossover: if calco > now or calco > bag, add 1440
  let diffMin;
  if (bMin !== null) {
    diffMin = bMin >= cMin ? bMin - cMin : (1440 - cMin) + bMin;
    // Delivered — show final resolved status
    if (diffMin >= lim.urgent)   return 'delivered-urgent';
    if (diffMin >= lim.veryLate) return 'delivered-late';
    return 'delivered-ok';
  } else {
    diffMin = nowMin >= cMin ? nowMin - cMin : (1440 - cMin) + nowMin;
    if (diffMin >= lim.urgent)   return 'urgent';
    if (diffMin >= lim.veryLate) return 'very-late';
    if (diffMin >= lim.late)     return 'late';
    return 'pending';
  }
}
function badge(status) {
  if (!status) return '';
  const map = {
    pending:          ['status-warn',      'dot-warn',      'Aguardando'],
    late:             ['status-late',      'dot-late',      'Atrasado'],
    'very-late':      ['status-very-late', 'dot-very-late', 'Muito Atrasado'],
    urgent:           ['status-urgent',    'dot-urgent',    '⚠ URGÊNCIA'],
    'delivered-ok':   ['status-ok',        'dot-ok',        '✓ Entregue'],
    'delivered-late': ['status-very-late', 'dot-very-late', 'Entregue com atraso'],
    'delivered-urgent':['status-late',     'dot-late',      'Entregue com muito atraso'],
  };
  const entry = map[status];
  if (!entry) return '';
  const [cls,dot,lbl] = entry;
  return `<span class="status-badge ${cls}"><span class="dot ${dot}"></span>${lbl}</span>`;
}

/* ── ORIGEM DISPLAY ── */
function origemHTML(id, row) {
  const val = row.origem_name
    ? `<span class="origem-name">${row.origem_name}</span><span class="origem-iata">${row.origem_iata||''}</span>`
    : `<span class="origem-empty">Definir origem</span>`;
  return `
    <div class="origem-wrap" id="ow-${id}">
      <div class="origem-display" onclick="openOrigem(${id})" id="od-${id}">${val}</div>
      <input class="origem-input" id="oi-${id}" type="text" placeholder="Nome ou sigla..." autocomplete="off"
        oninput="filterOrigem(${id},this.value)"
        onkeydown="origemKeydown(event,${id})"
        style="display:none" />
      <div class="origem-dropdown" id="odd-${id}"></div>
    </div>`;
}

function openOrigem(id) {
  closeAllDropdowns();
  const inp  = document.getElementById('oi-'+id);
  const disp = document.getElementById('od-'+id);
  const drop = document.getElementById('odd-'+id);
  const row  = rows.find(r => r.id === id);
  disp.style.display = 'none';
  inp.style.display  = 'block';
  inp.value = row ? (row.origem_name || '') : '';
  inp.focus();
  inp.select();
  drop.innerHTML = '<div class="origem-option-empty">Digite nome ou sigla — selecione ou pressione Enter para confirmar</div>';
  drop.classList.add('open');
  activeDropdown = id;
}

function filterOrigem(id, q) {
  const drop = document.getElementById('odd-'+id);
  const results = searchAirports(q);
  const freeOpt = q.trim()
    ? `<div class="origem-option origem-option-free" onclick="selectOrigemFree(${id},'${q.replace(/'/g,"\\'")}')" style="border-top:1px solid var(--border);margin-top:4px">
        <span class="origem-option-name" style="color:var(--text2)">Usar "<strong style="color:var(--text)">${q}</strong>" como está</span>
      </div>`
    : '';
  if (!results.length) {
    drop.innerHTML = `<div class="origem-option-empty">Nenhum aeroporto encontrado</div>${freeOpt}`;
    return;
  }
  drop.innerHTML = results.map((a,i) =>
    `<div class="origem-option" onclick="selectOrigem(${id},'${a.name.replace(/'/g,"\\'")}','${a.iata}')">
      <span class="origem-option-name">${a.name}</span>
      <span class="origem-option-iata">${a.iata}</span>
    </div>`
  ).join('') + freeOpt;
}

function origemKeydown(e, id) {
  if (e.key === 'Escape') { closeAllDropdowns(); return; }
  if (e.key === 'Enter') {
    const inp = document.getElementById('oi-'+id);
    const q   = inp ? inp.value.trim() : '';
    if (!q) { closeAllDropdowns(); return; }
    // if exactly one result, select it; otherwise save free text
    const results = searchAirports(q);
    if (results.length === 1) selectOrigem(id, results[0].name, results[0].iata);
    else selectOrigemFree(id, q);
  }
}

function selectOrigem(id, name, iata) {
  const row = rows.find(r => r.id === id);
  if (row) { row.origem_name = name; row.origem_iata = iata; row._justSelected = true; }
  closeAllDropdowns();
  renderTable();
}

function selectOrigemFree(id, text) {
  const row = rows.find(r => r.id === id);
  if (row) { row.origem_name = text; row.origem_iata = ''; row._justSelected = true; }
  closeAllDropdowns();
  renderTable();
}

function closeAllDropdowns() {
  if (activeDropdown !== null) {
    const inp  = document.getElementById('oi-'+activeDropdown);
    const disp = document.getElementById('od-'+activeDropdown);
    const drop = document.getElementById('odd-'+activeDropdown);
    // save whatever is typed as free text on blur if nothing was selected
    if (inp && inp.value.trim() && inp.style.display !== 'none') {
      const row = rows.find(r => r.id === activeDropdown);
      if (row && !row._justSelected) {
        row.origem_name = inp.value.trim();
        row.origem_iata = '';
      }
      if (row) delete row._justSelected;
    }
    if (inp)  inp.style.display  = 'none';
    if (disp) disp.style.display = '';
    if (drop) drop.classList.remove('open');
    activeDropdown = null;
    renderTable();
  }
}

function saveVoo(id, val) {
  const row = rows.find(r => r.id === id);
  if (row) { row.voo = val; persistData(); }
}
function setPrio(id, val) {
  const row = rows.find(r => r.id === id);
  if (!row) return;
  row.prio = row.prio === val ? '' : val;
  renderTable();
}
function addRow() {
  rows.push({ id: nextId++, prio:'', origem_name:'', origem_iata:'', voo:'', calco:'', esteira:'', primeira_pax:'', primeira_bag:'', ultima_bag:'' });
  renderTable();
}

/* ── PERSIST ── */
function persistData() {
  try {
    localStorage.setItem('beltmonitor_rows',   JSON.stringify(rows));
    localStorage.setItem('beltmonitor_nextid', String(nextId));
    showSaved();
  } catch(e) {}
}
function loadData() {
  try {
    const saved   = localStorage.getItem('beltmonitor_rows');
    const savedId = localStorage.getItem('beltmonitor_nextid');
    if (saved) { rows = JSON.parse(saved); nextId = savedId ? parseInt(savedId) : rows.length+1; return true; }
  } catch(e) {}
  return false;
}
function showSaved() {
  const el = document.getElementById('save-indicator');
  if (!el) return;
  el.textContent = 'Salvo ✓'; el.style.opacity='1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity='0'; }, 2000);
}

/* ── MODE ── */
function setMode(mode) {
  flightMode = mode;
  localStorage.setItem('beltmonitor_mode', mode);
  document.getElementById('mode-dom').className   = 'mode-btn'+(mode==='dom'  ?' active-dom':'');
  document.getElementById('mode-inter').className = 'mode-btn'+(mode==='inter'?' active-inter':'');
  const lim = getLimits();
  document.getElementById('mode-limits').textContent = `${lim.late}min → ${lim.veryLate}min → ${lim.urgent}min`;
  renderTable();
}

/* ── PICKER ── */
const FIELD_LABELS = { calco:'Calço', primeira_pax:'1º Pax', primeira_bag:'1ª Bag', ultima_bag:'Última Bag' };

function openPicker(id, field) {
  const row = rows.find(r => r.id === id);
  pTarget = { id, field };
  document.getElementById('picker-header').textContent = (FIELD_LABELS[field]||'Horário')+' — São Paulo';
  if (row[field]) { [pHour,pMin] = row[field].split(':').map(Number); }
  else { const t=spNow(); pHour=t.getHours(); pMin=t.getMinutes(); }
  updateDrum();
  syncManualInputs();
  buildQuick();
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('manual-h').focus(), 50);
}
function buildQuick() {
  const t=spNow(), base=t.getHours()*60+t.getMinutes();
  document.getElementById('quick-wrap').innerHTML = [-30,-15,-10,-5,0,5,10,15,30].map(o => {
    const total=((base+o)%1440+1440)%1440;
    const label=`${pad(Math.floor(total/60))}:${pad(total%60)}`;
    return `<button class="quick-chip${o===0?' is-now':''}" onclick="setQuick('${label}')">${label}${o===0?' ←':''}</button>`;
  }).join('');
}
function setQuick(t)   { [pHour,pMin]=t.split(':').map(Number); updateDrum(); syncManualInputs(); }
function changeHour(d) { pHour=(pHour+d+24)%24; updateDrum(); syncManualInputs(); }
function changeMin(d)  { pMin=(pMin+d+60)%60;   updateDrum(); syncManualInputs(); }
function updateDrum()  { document.getElementById('ph').textContent=pad(pHour); document.getElementById('pm').textContent=pad(pMin); }
function syncManualInputs() {
  document.getElementById('manual-h').value = pad(pHour);
  document.getElementById('manual-m').value = pad(pMin);
}

/* Manual input → drum sync */
document.getElementById('manual-h').addEventListener('input', function() {
  let v = parseInt(this.value);
  if (isNaN(v)) return;
  v = Math.max(0, Math.min(23, v));
  pHour = v; updateDrum();
});
document.getElementById('manual-m').addEventListener('input', function() {
  let v = parseInt(this.value);
  if (isNaN(v)) return;
  v = Math.max(0, Math.min(59, v));
  pMin = v; updateDrum();
});
/* Auto-jump from hour to minute after 2 digits */
document.getElementById('manual-h').addEventListener('keyup', function() {
  if (this.value.length >= 2) document.getElementById('manual-m').focus();
});

function confirmTime() {
  if (!pTarget) return;
  const row = rows.find(r => r.id === pTarget.id);
  if (row) row[pTarget.field] = `${pad(pHour)}:${pad(pMin)}`;
  closePicker(); renderTable();
}
function clearTime() {
  if (!pTarget) return;
  const row = rows.find(r => r.id === pTarget.id);
  if (row) row[pTarget.field] = '';
  closePicker(); renderTable();
}
function closePicker() {
  document.getElementById('overlay').classList.remove('open');
  pTarget = null;
}

/* ── EVENTS ── */
document.getElementById('overlay').addEventListener('click', e => { if (e.target===e.currentTarget) closePicker(); });
document.getElementById('add-btn').addEventListener('click', addRow);
document.getElementById('clear-btn').addEventListener('click', () => {
  if (confirm('Limpar todos os voos?')) { rows=[]; nextId=1; renderTable(); }
});
document.addEventListener('click', e => {
  if (activeDropdown !== null && !e.target.closest('.origem-wrap')) closeAllDropdowns();
});
document.addEventListener('keydown', e => {
  const open = document.getElementById('overlay').classList.contains('open');
  if (open && e.key==='Escape') closePicker();
  if (open && e.key==='Enter' && document.activeElement.id !== 'manual-h' && document.activeElement.id !== 'manual-m') confirmTime();
});

/* ── INIT ── */
updateClock();
setInterval(updateClock, 1000);
setInterval(renderTable, 15000);

const savedMode = localStorage.getItem('beltmonitor_mode') || 'dom';
const loaded    = loadData();
if (!loaded || rows.length===0) { addRow(); addRow(); }
setMode(savedMode);
</script>
</body>
</html>
